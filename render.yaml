services:
  - type: web
    name: ai-job-matcher
    runtime: python
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: USE_SENTENCE_TRANSFORMERS
        value: "false"
